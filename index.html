  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // 動態光學背景與粒子透鏡 (依 ITRI 配色調校)
    const OpticsBackground = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const particles = Array.from({ length: 35 }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 2.5 + 1.0,
          alpha: Math.random() * 0.5 + 0.2,
          speedAlpha: (Math.random() * 0.01 + 0.003) * (Math.random() > 0.5 ? 1 : -1),
          speedY: -(Math.random() * 0.3 + 0.1),
          color: Math.random() > 0.5 ? 'rgba(0, 108, 183,' : 'rgba(0, 166, 179,'
        }));

        const beams = Array.from({ length: 4 }, () => ({
          x: Math.random() * width,
          angle: (Math.random() * 20 - 10) * (Math.PI / 180),
          width: Math.random() * 140 + 80,
          speed: Math.random() * 0.12 + 0.04,
          opacity: Math.random() * 0.05 + 0.02
        }));

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          beams.forEach(b => {
            b.x += b.speed;
            if (b.x > width + 200) b.x = -200;

            const grad = ctx.createLinearGradient(b.x, 0, b.x + Math.tan(b.angle) * height, height);
            grad.addColorStop(0, 'rgba(0, 108, 183, 0)');
            grad.addColorStop(0.5, `rgba(0, 166, 179, ${b.opacity})`);
            grad.addColorStop(1, 'rgba(0, 108, 183, 0)');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(b.x, 0);
            ctx.lineTo(b.x + b.width, 0);
            ctx.lineTo(b.x + b.width + Math.tan(b.angle) * height, height);
            ctx.lineTo(b.x + Math.tan(b.angle) * height, height);
            ctx.closePath();
            ctx.fill();
          });

          particles.forEach(p => {
            p.y += p.speedY;
            p.alpha += p.speedAlpha;

            if (p.alpha >= 0.7 || p.alpha <= 0.1) {
              p.speedAlpha = -p.speedAlpha;
            }
            if (p.y < -10) {
              p.y = height + 10;
              p.x = Math.random() * width;
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = `${p.color}${Math.max(0, Math.min(1, p.alpha))})`;
            ctx.shadowBlur = p.radius * 3;
            ctx.shadowColor = '#00A6B3';
            ctx.fill();
            ctx.shadowBlur = 0;
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
          <canvas ref={canvasRef} className="absolute inset-0 w-full h-full opacity-60" />

          <div 
            className="absolute -top-40 -left-40 w-[600px] h-[600px] rounded-full blur-[140px] pointer-events-none optical-ray-1"
            style={{ background: 'radial-gradient(circle, rgba(0, 108, 183, 0.08) 0%, rgba(0, 166, 179, 0.03) 50%, transparent 70%)' }}
          />
          <div 
            className="absolute top-1/3 -right-40 w-[700px] h-[700px] rounded-full blur-[160px] pointer-events-none optical-ray-2"
            style={{ background: 'radial-gradient(circle, rgba(46, 125, 107, 0.06) 0%, rgba(0, 108, 183, 0.02) 60%, transparent 80%)' }}
          />
        </div>
      );
    };

    // 動態光學鏡頭與雷射掃描模擬器 (右側視覺)
    const OpticalSimulation = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = 0;
        let height = 0;

        const updateSize = () => {
          const parent = canvas.parentElement;
          if (!parent) return;
          const rect = parent.getBoundingClientRect();
          const w = rect.width || parent.clientWidth || 400;
          const h = rect.height || parent.clientHeight || 350;
          const dpr = window.devicePixelRatio || 1;
          
          if (w !== width || h !== height) {
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            ctx.setTransform(1, 0, 0, 1, 0, 0); // 重設縮放比例避免疊加
            ctx.scale(dpr, dpr);
            width = w;
            height = h;
          }
        };

        updateSize();
        let time = 0;

        const render = () => {
          if (width === 0 || height === 0) updateSize(); // 確保畫布有正確尺寸
          
          ctx.clearRect(0, 0, width, height);
          const cx = width / 2;
          const cy = height / 2;
          time += 0.01;

          // 繪製背景發光
          const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, width/2);
          bgGrad.addColorStop(0, 'rgba(0, 255, 255, 0.05)');
          bgGrad.addColorStop(1, 'transparent');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, width, height);

          // 外部光學環圈 1
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(time * 0.2);
          ctx.beginPath();
          ctx.arc(0, 0, 140, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 6]);
          ctx.stroke();
          ctx.restore();

          // 外部光學環圈 2 (帶刻度)
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(-time * 0.1);
          ctx.beginPath();
          ctx.arc(0, 0, 120, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)';
          ctx.lineWidth = 2;
          ctx.setLineDash([20, 15, 2, 15]);
          ctx.stroke();
          ctx.restore();

          // 內部精密鏡片環
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(time * 0.4);
          ctx.beginPath();
          ctx.arc(0, 0, 75, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.lineWidth = 1;
          ctx.setLineDash([50, 10, 5, 10]);
          ctx.stroke();
          
          // 內部鏡片刻度裝飾
          for (let i = 0; i < 12; i++) {
             ctx.beginPath();
             ctx.moveTo(65 * Math.cos(i * Math.PI/6), 65 * Math.sin(i * Math.PI/6));
             ctx.lineTo(75 * Math.cos(i * Math.PI/6), 75 * Math.sin(i * Math.PI/6));
             ctx.strokeStyle = 'rgba(0, 255, 255, 0.6)';
             ctx.lineWidth = 2;
             ctx.stroke();
          }
          ctx.restore();

          // 核心焦點透鏡
          ctx.beginPath();
          ctx.arc(cx, cy, 30, 0, Math.PI * 2);
          const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 30);
          coreGrad.addColorStop(0, 'rgba(0, 255, 255, 0.8)');
          coreGrad.addColorStop(0.4, 'rgba(0, 166, 179, 0.3)');
          coreGrad.addColorStop(1, 'rgba(0, 108, 183, 0)');
          ctx.fillStyle = coreGrad;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(cx, cy, 30, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(0, 255, 255, 0.8)';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // 雷射/光束穿透
          const rayCount = 3;
          for(let i=0; i<rayCount; i++){
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(time * 1.5 + (i * Math.PI * 2 / rayCount));
            
            // 掃描扇形
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, 180, -0.1, 0.1);
            ctx.lineTo(0, 0);
            const scanGrad = ctx.createLinearGradient(0, 0, 180, 0);
            scanGrad.addColorStop(0, 'rgba(0, 255, 255, 0.25)');
            scanGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = scanGrad;
            ctx.fill();

            // 雷射主線
            ctx.beginPath();
            ctx.moveTo(30, 0);
            ctx.lineTo(180, 0);
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.7)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            
            ctx.restore();
          }

          // 浮動粒子 (模擬光子或粉塵)
          const particleCount = 20;
          for(let i=0; i<particleCount; i++){
            const pAngle = (i * 137.5) + time * 0.5; // 均勻分佈加上旋轉
            const pDist = 40 + (i * 7) % 100;
            const px = cx + Math.cos(pAngle) * pDist;
            const py = cy + Math.sin(pAngle) * pDist;
            ctx.beginPath();
            ctx.arc(px, py, 1.5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${0.2 + 0.8 * Math.sin(time * 3 + i)})`;
            ctx.fill();
          }

          animationFrameId = requestAnimationFrame(render);
        };

        // 啟動渲染
        updateSize();
        render();

        // 使用 ResizeObserver 提供更穩定可靠的畫布響應式調整，避免首次渲染時容器寬高為 0 的問題
        let resizeObserver;
        if (window.ResizeObserver && canvas.parentElement) {
          resizeObserver = new ResizeObserver(() => updateSize());
          resizeObserver.observe(canvas.parentElement);
        }
        
        window.addEventListener('resize', updateSize);

        return () => {
          cancelAnimationFrame(animationFrameId);
          if (resizeObserver) resizeObserver.disconnect();
          window.removeEventListener('resize', updateSize);
        };
      }, []);

      return (
        <div className="w-full h-full min-h-[300px] flex items-center justify-center relative pointer-events-none">
          <canvas ref={canvasRef} className="w-full h-full absolute inset-0 z-10" />
          <div className="absolute inset-0 bg-gradient-to-l from-itri-blue/10 to-transparent mix-blend-overlay z-0"></div>
        </div>
      );
    };

    function App() {
      const [currentTab, setCurrentTab] = useState('functional-coatings-films');
      const [activeNav, setActiveNav] = useState('home'); // 修正：將預設頁面從 'products' 變更為 'home'
      const [megaMenuOpen, setMegaMenuOpen] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const megaMenuTimeout = useRef(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [lang, setLang] = useState('ZH');
      const [toastMsg, setToastMsg] = useState(null);

      const [contactForm, setContactForm] = useState({
        name: '',
        company: '',
        email: '',
        phone: '',
        category: '共同研發與良率優化(Co-Development & Yield Optimization)',
        description: ''
      });
      const [isContactSubmitting, setIsContactSubmitting] = useState(false);
      const [contactModalOpen, setContactModalOpen] = useState(false);
      const [contactModalMessage, setContactModalMessage] = useState('');
      const iframeRef = useRef(null);

      const GOOGLE_FORM_ACTION = 'https://docs.google.com/forms/u/0/d/e/1FAIpQLSeuEvyMnbBpUfmwsHVizJDf_fyfyQPdOXV_3tQcSKB0-y-ITw/formResponse';
      const GOOGLE_FORM_FIELDS = {
        name: 'entry.1828672223',
        company: 'entry.267269794',
        email: 'entry.98510672',
        phone: 'entry.540037173',
        category: 'entry.48382572',
        description: 'entry.1915382228'
      };

      const initialContactForm = {
        name: '',
        company: '',
        email: '',
        phone: '',
        category: '共同研發與良率優化(Co-Development & Yield Optimization)',
        description: ''
      };

      const handleContactInputChange = (field, value) => {
        setContactForm(prev => ({ ...prev, [field]: value }));
      };

      const submitToGoogleForm = async () => {
        const submitHiddenForm = () => {
          try {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = GOOGLE_FORM_ACTION;
            form.target = 'crystal-yu-contact-iframe';
            form.acceptCharset = 'utf-8';
            form.style.display = 'none';

            const hiddenFields = [
              [GOOGLE_FORM_FIELDS.name, contactForm.name],
              [GOOGLE_FORM_FIELDS.company, contactForm.company],
              [GOOGLE_FORM_FIELDS.email, contactForm.email],
              [GOOGLE_FORM_FIELDS.phone, contactForm.phone],
              [GOOGLE_FORM_FIELDS.category, contactForm.category],
              [GOOGLE_FORM_FIELDS.description, contactForm.description],
              ['fvv', '1'],
              ['partialResponse', '[null,null,"1445690265061088753"]'],
              ['pageHistory', '0'],
              ['fbzx', '1445690265061088753'],
              ['submissionTimestamp', '-1']
            ];

            hiddenFields.forEach(([name, value]) => {
              const input = document.createElement('input');
              input.type = 'hidden';
              input.name = name;
              input.value = String(value);
              form.appendChild(input);
            });

            document.body.appendChild(form);
            form.submit();
            form.remove();
            return true;
          } catch (error) {
            return false;
          }
        };

        const formSubmitted = submitHiddenForm();
        if (!formSubmitted) return false;

        try {
          const formData = new URLSearchParams();
          formData.append(GOOGLE_FORM_FIELDS.name, contactForm.name || '');
          formData.append(GOOGLE_FORM_FIELDS.company, contactForm.company || '');
          formData.append(GOOGLE_FORM_FIELDS.email, contactForm.email || '');
          formData.append(GOOGLE_FORM_FIELDS.phone, contactForm.phone || '');
          formData.append(GOOGLE_FORM_FIELDS.category, contactForm.category || '');
          formData.append(GOOGLE_FORM_FIELDS.description, contactForm.description || '');
          formData.append('fvv', '1');
          formData.append('partialResponse', '[null,null,"1445690265061088753"]');
          formData.append('pageHistory', '0');
          formData.append('fbzx', '1445690265061088753');
          formData.append('submissionTimestamp', '-1');

          await fetch(GOOGLE_FORM_ACTION, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
            body: formData.toString()
          });
          return true;
        } catch (error) {
          return true;
        }
      };

      const handleContactSubmit = async (e) => {
        e.preventDefault();
        if (!e.currentTarget.checkValidity()) {
          e.currentTarget.reportValidity();
          return;
        }

        if (isContactSubmitting) return;
        setIsContactSubmitting(true);

        const submitted = await submitToGoogleForm();

        const finishSubmission = () => {
          setContactForm(initialContactForm);
          setIsContactSubmitting(false);
          setContactModalMessage(
            submitted
              ? '需求已送出，我們將盡快與您聯絡！'
              : '表單送出時遇到連線問題，請直接使用郵件聯絡我們，或稍後再試。'
          );
          setContactModalOpen(true);
        };

        if (iframeRef.current) {
          iframeRef.current.onload = finishSubmission;
        }
        setTimeout(finishSubmission, 1200);
      };

      const handleMenuMouseEnter = () => {
        if (megaMenuTimeout.current) clearTimeout(megaMenuTimeout.current);
        setMegaMenuOpen(true);
      };

      const handleMenuMouseLeave = () => {
        megaMenuTimeout.current = setTimeout(() => {
          setMegaMenuOpen(false);
        }, 250);
      };

      const currentCategoryObj = useMemo(() => {
        return CATEGORIES.find(c => c.id === currentTab) || CATEGORIES[0];
      }, [currentTab]);

      const filteredProducts = useMemo(() => {
        return currentCategoryObj.products.filter(p => {
          const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              p.nameZH.includes(searchQuery) ||
                              p.desc.includes(searchQuery);
          return matchSearch;
        });
      }, [currentCategoryObj, searchQuery]);

      const showToast = (text) => {
        setToastMsg(text);
        setTimeout(() => setToastMsg(null), 3800);
      };

      const handleDownloadProductSpec = (productName, dsObj) => {
        if (!dsObj) return;
        showToast(`已開始下載「${productName}」${dsObj.name}：${dsObj.file}`);

        const link = document.createElement('a');
        link.href = dsObj.file;
        link.download = dsObj.file.split('/').pop();
        link.target = '_blank';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="min-h-screen flex flex-col font-sans bg-itri-extralight text-itri-dark selection:bg-itri-blue selection:text-white relative">
          
          <OpticsBackground />

          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-itri-dark text-white px-5 py-3.5 rounded-xl shadow-2xl flex items-center gap-3 border border-itri-teal animate-bounce">
              <div className="w-8 h-8 rounded-full bg-itri-teal/20 text-itri-teal flex items-center justify-center font-bold">
                <IconDownload className="w-4 h-4 text-itri-teal" />
              </div>
              <span className="text-xs sm:text-sm font-medium text-slate-100">{toastMsg}</span>
            </div>
          )}

          <iframe
            ref={iframeRef}
            name="crystal-yu-contact-iframe"
            title="silent form submit"
            className="hidden"
          />

          {/* CONTACT FORM MODAL */}
          {contactModalOpen && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center bg-itri-dark/60 px-4 backdrop-blur-sm">
              <div className="w-full max-w-md rounded-2xl border border-itri-lightgray bg-white p-6 shadow-2xl text-center">
                <div className="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-itri-blue/10 text-itri-blue">
                  <IconCheckCircle className="w-6 h-6" />
                </div>
                <h3 className="text-lg font-bold text-itri-dark mb-2">通知</h3>
                <p className="text-xs sm:text-sm text-itri-gray mb-6">{contactModalMessage}</p>
                <button
                  onClick={() => setContactModalOpen(false)}
                  className="w-full py-2.5 rounded-xl bg-itri-blue hover:bg-itri-blue/90 text-white font-bold text-sm transition"
                >
                  確認
                </button>
              </div>
            </div>
          )}

          {/* HEADER */}
          <header className="sticky top-0 z-40 bg-itri-blue text-white shadow-md">
            <div className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16 sm:h-20">
                
                {/* LOGO */}
                <div 
                  className="flex items-center gap-2 sm:gap-3 cursor-pointer group shrink-0"
                  onClick={() => { setActiveNav('home'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                >
                  <div className="w-8 h-8 sm:w-10 sm:h-10 rounded-lg overflow-hidden bg-white shadow-md group-hover:scale-105 transition shrink-0">
                    <img src="mywork/晶禹科技logo.png" alt="Crystal Yu Tech Logo" className="w-full h-full object-contain p-1" />
                  </div>
                  <div className="inline-flex flex-col items-stretch">
                    <div className="flex justify-between text-base sm:text-xl font-black text-white leading-tight gap-0.5 sm:gap-1">
                      <span>晶</span><span>禹</span><span>科</span><span>技</span>
                    </div>
                    <div className="text-[8px] sm:text-[10px] text-cyan-300 font-bold tracking-[0.04em] font-mono uppercase leading-tight mt-0.5">
                      CRYSTAL YU TECH
                    </div>
                  </div>
                </div>

                {/* MOBILE MENU TOGGLE */}
                <div className="flex items-center gap-2 lg:hidden">
                  <button 
                    onClick={() => setLang(lang === 'ZH' ? 'EN' : 'ZH')}
                    className="flex items-center gap-1 px-2 py-1 rounded border border-white/30 bg-white/10 text-[11px] font-medium text-white"
                  >
                    <IconGlobe className="w-3 h-3" />
                    <span>{lang === 'ZH' ? '繁中' : 'EN'}</span>
                  </button>
                  <button 
                    onClick={() => setMobileMenuOpen(!mobileMenuOpen)} 
                    aria-label="Toggle Menu" 
                    className="p-2 rounded-lg text-white hover:bg-white/10 active:bg-white/20"
                  >
                    {mobileMenuOpen ? (
                      <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    ) : (
                      <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    )}
                  </button>
                </div>

                {/* DESKTOP NAVIGATION */}
                <nav className="hidden lg:flex items-center space-x-1 lg:space-x-2">

                    onClick={() => { setActiveNav('home'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}

                    首頁
                  </button>

                  <button 
                    onClick={() => { setActiveNav('about'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                    className={`px-3.5 py-2 rounded-lg text-sm font-semibold transition ${activeNav === 'about' ? 'bg-white/20 text-white' : 'text-white/90 hover:bg-white/10 hover:text-white'}`}
                  >
                    關於晶禹科技
                  </button>

                  <div 
                    className="relative py-2"
                    onMouseEnter={handleMenuMouseEnter}
                    onMouseLeave={handleMenuMouseLeave}
                  >
                    <button 
                      onClick={() => { setActiveNav('products'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                      className={`px-3.5 py-2 rounded-lg text-sm font-semibold inline-flex items-center gap-1 transition ${activeNav === 'products' ? 'bg-white/20 text-white' : 'text-white/90 hover:bg-white/10 hover:text-white'}`}

                    {megaMenuOpen && (
                      <div className="absolute top-full left-0 w-72 bg-white border border-itri-lightgray rounded-xl shadow-xl p-2 animate-fadeIn z-50 mt-1">

                          <button
                            key={cat.id}

                          </button>
                        ) : (
                          <button
                            onClick={() => {
                              const el = document.getElementById('contact-section');
                              if (el) el.scrollIntoView({ behavior: 'smooth' });
                            }}
                            className="w-full py-2.5 rounded-xl bg-itri-extralight hover:bg-itri-lightgray text-itri-dark text-xs font-medium transition text-center border border-itri-lightgray active:scale-[0.98]"
                          >
                            專案客製洽詢
                          </button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>

              </div>
            </main>
          )}

          {/* MAIN SECTION: TECH COLUMN */}
          {activeNav === 'tech-column' && (
            <main className="flex-1 py-12">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                
                <div className="relative overflow-hidden rounded-3xl bg-white border border-itri-lightgray p-8 sm:p-12 shadow-md min-h-[280px] flex items-center">
                  <div className="relative z-10 max-w-3xl">
                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-itri-blue/10 border border-itri-blue/20 text-itri-blue text-xs font-bold mb-4">
                      <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
                      晶禹前瞻技術
                    </div>
                    <h1 className="text-3xl sm:text-4xl font-black text-itri-dark tracking-tight mb-4">
                      晶禹技術專欄
                    </h1>
                    <p className="text-itri-gray text-sm sm:text-base leading-relaxed font-normal">
                      專欄內容準備中，敬請期待。
                    </p>
                  </div>
                </div>

              </div>
            </main>
          )}

          {/* CONTACT SECTION */}
          <section id="contact-section" className="py-20 bg-white border-t border-itri-lightgray shadow-inner">
            <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center mb-12">
                <h2 className="text-3xl font-extrabold text-itri-dark mb-3">聯絡專案專家團隊</h2>
                <p className="text-itri-gray text-sm">請填寫以下資訊，我們的技術團隊將於 24 小時內與您聯繫</p>
              </div>

              <form onSubmit={handleContactSubmit} className="bg-itri-extralight rounded-2xl p-6 sm:p-10 border border-itri-lightgray shadow-sm space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                  <div>
                    <label className="block text-xs font-semibold text-itri-dark mb-2">姓名 *</label>
                    <input 
                      type="text"
                      required
                      value={contactForm.name}
                      onChange={e => handleContactInputChange('name', e.target.value)}
                      placeholder="您的姓名"
                      className="w-full bg-white border border-itri-lightgray rounded-xl px-4 py-3 text-sm text-itri-dark placeholder-itri-midgray focus:outline-none focus:border-itri-blue"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-itri-dark mb-2">公司／單位 *</label>
                    <input 
                      type="text"
                      required
                      value={contactForm.company}
                      onChange={e => handleContactInputChange('company', e.target.value)}
                      placeholder="公司或機構名稱"
                      className="w-full bg-white border border-itri-lightgray rounded-xl px-4 py-3 text-sm text-itri-dark placeholder-itri-midgray focus:outline-none focus:border-itri-blue"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-itri-dark mb-2">電子郵件 *</label>
                    <input 
                      type="email"
                      required
                      value={contactForm.email}
                      onChange={e => handleContactInputChange('email', e.target.value)}
                      placeholder="name@company.com"
                      className="w-full bg-white border border-itri-lightgray rounded-xl px-4 py-3 text-sm text-itri-dark placeholder-itri-midgray focus:outline-none focus:border-itri-blue"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-itri-dark mb-2">聯絡電話</label>
                    <input 
                      type="tel"
                      value={contactForm.phone}
                      onChange={e => handleContactInputChange('phone', e.target.value)}
                      placeholder="+886 912 345 678"
                      className="w-full bg-white border border-itri-lightgray rounded-xl px-4 py-3 text-sm text-itri-dark placeholder-itri-midgray focus:outline-none focus:border-itri-blue"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-itri-dark mb-2">需求類別</label>
                  <select
                    value={contactForm.category}
                    onChange={e => handleContactInputChange('category', e.target.value)}
                    className="w-full bg-white border border-itri-lightgray rounded-xl px-4 py-3 text-sm text-itri-dark focus:outline-none focus:border-itri-blue"
                  >
                    <option value="無人機熱成像與監控光學鏡頭專案">無人機熱成像與監控光學鏡頭專案 (UAV & Surveillance Optics)</option>
                    <option value="共同研發與良率優化(Co-Development & Yield Optimization)">共同研發與良率優化 (Co-Development & Yield Optimization)</option>
                    <option value="跨領域光學設計與開發試作">跨領域光學設計與開發試作 (車用/LED/雷射)</option>
                    <option value="功能性塗料 / 防霧膜試塗與評估">功能性塗料 / 防霧膜試塗與評估</option>
                    <option value="其他專案合作">其他專案合作</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-itri-dark mb-2">需求說明 *</label>
                  <textarea 
                    rows="4"
                    required
                    value={contactForm.description}
                    onChange={e => handleContactInputChange('description', e.target.value)}
                    placeholder="請簡述您的需求、無人機載重或光學規格標的..."
                    className="w-full bg-white border border-itri-lightgray rounded-xl px-4 py-3 text-sm text-itri-dark placeholder-itri-midgray focus:outline-none focus:border-itri-blue"
                  />
                </div>

                <div className="text-center pt-2">
                  <button
                    type="submit"
                    disabled={isContactSubmitting}
                    className="w-full sm:w-auto px-10 py-3.5 rounded-xl bg-gradient-to-r from-itri-blue to-itri-teal text-white font-bold text-sm shadow-lg hover:shadow-xl hover:brightness-105 active:scale-95 transition disabled:opacity-50"
                  >
                    {isContactSubmitting ? '傳送中...' : '送出專案需求'}
                  </button>
                </div>
              </form>
            </div>
          </section>

          {/* FLOATING QUICK CONTACT BUTTON FOR MOBILE */}
          <div className="sm:hidden fixed bottom-4 right-4 z-30">
            <button 
              onClick={() => {
                const el = document.getElementById('contact-section');
                if (el) el.scrollIntoView({ behavior: 'smooth' });
              }}
              className="bg-itri-blue text-white p-3.5 rounded-full shadow-2xl flex items-center justify-center border border-white/20 active:scale-90 transition"
              aria-label="快速諮詢"
            >
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-4l-4 4z"></path>
              </svg>
            </button>
          </div>

          {/* FOOTER */}
          <footer className="bg-itri-dark text-white text-xs py-10 sm:py-12">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
                <div>
                  <div className="text-white font-bold text-base mb-2">晶禹科技 Crystal Yu Tech</div>
                  <p className="text-itri-midgray text-xs leading-relaxed">無人機載具與監控光學系統 · 高輻射 / 非導電奈米散熱塗料 · 先進材料研發</p>
                </div>
                <div>
                  <div className="text-white font-semibold mb-2">產品系列</div>
                  <ul className="space-y-1.5 text-itri-midgray">
                    {CATEGORIES.map(c => (
                      <li key={c.id} className="hover:text-cyan-300 cursor-pointer active:text-cyan-400" onClick={() => { setCurrentTab(c.id); setActiveNav('products'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}>{c.title}</li>
                    ))}
                  </ul>
                </div>
                <div>
                  <div className="text-white font-semibold mb-2">聯絡資訊</div>
                  <p className="text-itri-midgray leading-relaxed">
                    服務專線：<a href="tel:+886426222720" className="underline hover:text-cyan-300">+886 4 26222720</a><br />
                    電子郵件：<a href="mailto:kendyjojo@gmai.com" className="underline hover:text-cyan-300">kendyjojo@gmai.com</a><br />
                    公司地址：43616 台中市清水區星海路18巷17號<br />
                    統一編號：94020346
                  </p>
                </div>
              </div>
              <div className="pt-8 border-t border-gray-700 text-center text-itri-midgray text-[11px]">
                © {new Date().getFullYear()} Crystal Yu Tech Co., Ltd. All rights reserved. 晶禹科技有限公司 版權所有
              </div>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
