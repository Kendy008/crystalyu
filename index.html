  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // 動態光學背景與粒子透鏡 (依 ITRI 配色調校)
    const OpticsBackground = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const particles = Array.from({ length: 35 }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 2.5 + 1.0,
          alpha: Math.random() * 0.5 + 0.2,
          speedAlpha: (Math.random() * 0.01 + 0.003) * (Math.random() > 0.5 ? 1 : -1),
          speedY: -(Math.random() * 0.3 + 0.1),
          color: Math.random() > 0.5 ? 'rgba(0, 108, 183,' : 'rgba(0, 166, 179,'
        }));

        const beams = Array.from({ length: 4 }, () => ({
          x: Math.random() * width,
          angle: (Math.random() * 20 - 10) * (Math.PI / 180),
          width: Math.random() * 140 + 80,
          speed: Math.random() * 0.12 + 0.04,
          opacity: Math.random() * 0.05 + 0.02
        }));

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          beams.forEach(b => {
            b.x += b.speed;
            if (b.x > width + 200) b.x = -200;

            const grad = ctx.createLinearGradient(b.x, 0, b.x + Math.tan(b.angle) * height, height);
            grad.addColorStop(0, 'rgba(0, 108, 183, 0)');
            grad.addColorStop(0.5, `rgba(0, 166, 179, ${b.opacity})`);
            grad.addColorStop(1, 'rgba(0, 108, 183, 0)');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(b.x, 0);
            ctx.lineTo(b.x + b.width, 0);
            ctx.lineTo(b.x + b.width + Math.tan(b.angle) * height, height);
            ctx.lineTo(b.x + Math.tan(b.angle) * height, height);
            ctx.closePath();
            ctx.fill();
          });

          particles.forEach(p => {
            p.y += p.speedY;
            p.alpha += p.speedAlpha;

            if (p.alpha >= 0.7 || p.alpha <= 0.1) {
              p.speedAlpha = -p.speedAlpha;
            }
            if (p.y < -10) {
              p.y = height + 10;
              p.x = Math.random() * width;
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = `${p.color}${Math.max(0, Math.min(1, p.alpha))})`;
            ctx.shadowBlur = p.radius * 3;
            ctx.shadowColor = '#00A6B3';
            ctx.fill();
            ctx.shadowBlur = 0;
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
          <canvas ref={canvasRef} className="absolute inset-0 w-full h-full opacity-60" />

          <div 
            className="absolute -top-40 -left-40 w-[600px] h-[600px] rounded-full blur-[140px] pointer-events-none optical-ray-1"
            style={{ background: 'radial-gradient(circle, rgba(0, 108, 183, 0.08) 0%, rgba(0, 166, 179, 0.03) 50%, transparent 70%)' }}
          />
          <div 
            className="absolute top-1/3 -right-40 w-[700px] h-[700px] rounded-full blur-[160px] pointer-events-none optical-ray-2"
            style={{ background: 'radial-gradient(circle, rgba(46, 125, 107, 0.06) 0%, rgba(0, 108, 183, 0.02) 60%, transparent 80%)' }}
          />
        </div>
      );
    };

    // 動態光學鏡頭與雷射掃描模擬器 (右側視覺)
    const OpticalSimulation = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = 0;
        let height = 0;

        const updateSize = () => {
          const parent = canvas.parentElement;
          if (!parent) return;
          const rect = parent.getBoundingClientRect();
          const w = rect.width || parent.clientWidth || 400;
          const h = rect.height || parent.clientHeight || 350;
          const dpr = window.devicePixelRatio || 1;
          
          if (w !== width || h !== height) {
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            ctx.setTransform(1, 0, 0, 1, 0, 0); // 重設縮放比例避免疊加
            ctx.scale(dpr, dpr);
            width = w;
            height = h;
          }
        };

        updateSize();
        let time = 0;

        const render = () => {
          if (width === 0 || height === 0) updateSize(); // 確保畫布有正確尺寸
          
          ctx.clearRect(0, 0, width, height);
          const cx = width / 2;
          const cy = height / 2;
          time += 0.01;

          // 繪製背景發光
          const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, width/2);
          bgGrad.addColorStop(0, 'rgba(0, 255, 255, 0.05)');
          bgGrad.addColorStop(1, 'transparent');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, width, height);

          // 外部光學環圈 1
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(time * 0.2);
          ctx.beginPath();
          ctx.arc(0, 0, 140, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 6]);
          ctx.stroke();
          ctx.restore();

          // 外部光學環圈 2 (帶刻度)
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(-time * 0.1);
          ctx.beginPath();
          ctx.arc(0, 0, 120, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)';
          ctx.lineWidth = 2;
          ctx.setLineDash([20, 15, 2, 15]);
          ctx.stroke();
          ctx.restore();

          // 內部精密鏡片環
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(time * 0.4);
          ctx.beginPath();
          ctx.arc(0, 0, 75, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.lineWidth = 1;
          ctx.setLineDash([50, 10, 5, 10]);
          ctx.stroke();
          
          // 內部鏡片刻度裝飾
          for (let i = 0; i < 12; i++) {
             ctx.beginPath();
             ctx.moveTo(65 * Math.cos(i * Math.PI/6), 65 * Math.sin(i * Math.PI/6));
             ctx.lineTo(75 * Math.cos(i * Math.PI/6), 75 * Math.sin(i * Math.PI/6));
             ctx.strokeStyle = 'rgba(0, 255, 255, 0.6)';
             ctx.lineWidth = 2;
             ctx.stroke();
          }
          ctx.restore();

          // 核心焦點透鏡
          ctx.beginPath();
          ctx.arc(cx, cy, 30, 0, Math.PI * 2);
          const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 30);
          coreGrad.addColorStop(0, 'rgba(0, 255, 255, 0.8)');
          coreGrad.addColorStop(0.4, 'rgba(0, 166, 179, 0.3)');
          coreGrad.addColorStop(1, 'rgba(0, 108, 183, 0)');
          ctx.fillStyle = coreGrad;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(cx, cy, 30, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(0, 255, 255, 0.8)';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // 雷射/光束穿透
          const rayCount = 3;
          for(let i=0; i<rayCount; i++){
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(time * 1.5 + (i * Math.PI * 2 / rayCount));
            
            // 掃描扇形
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, 180, -0.1, 0.1);
            ctx.lineTo(0, 0);
            const scanGrad = ctx.createLinearGradient(0, 0, 180, 0);
            scanGrad.addColorStop(0, 'rgba(0, 255, 255, 0.25)');
            scanGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = scanGrad;
            ctx.fill();

            // 雷射主線
            ctx.beginPath();
            ctx.moveTo(30, 0);
            ctx.lineTo(180, 0);
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.7)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            
            ctx.restore();
          }

          // 浮動粒子 (模擬光子或粉塵)
          const particleCount = 20;
          for(let i=0; i<particleCount; i++){
            const pAngle = (i * 137.5) + time * 0.5; // 均勻分佈加上旋轉
            const pDist = 40 + (i * 7) % 100;
            const px = cx + Math.cos(pAngle) * pDist;
            const py = cy + Math.sin(pAngle) * pDist;
            ctx.beginPath();
            ctx.arc(px, py, 1.5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${0.2 + 0.8 * Math.sin(time * 3 + i)})`;
            ctx.fill();
          }

          animationFrameId = requestAnimationFrame(render);
        };

        // 啟動渲染
        updateSize();
        render();

        // 使用 ResizeObserver 提供更穩定可靠的畫布響應式調整，避免首次渲染時容器寬高為 0 的問題
        let resizeObserver;
        if (window.ResizeObserver && canvas.parentElement) {
          resizeObserver = new ResizeObserver(() => updateSize());
          resizeObserver.observe(canvas.parentElement);
        }
        
        window.addEventListener('resize', updateSize);

        return () => {
          cancelAnimationFrame(animationFrameId);
          if (resizeObserver) resizeObserver.disconnect();
          window.removeEventListener('resize', updateSize);
        };
      }, []);

      return (
        <div className="w-full h-full min-h-[300px] flex items-center justify-center relative pointer-events-none">
          <canvas ref={canvasRef} className="w-full h-full absolute inset-0 z-10" />
          <div className="absolute inset-0 bg-gradient-to-l from-itri-blue/10 to-transparent mix-blend-overlay z-0"></div>
        </div>
      );
    };

      const productSecondary = product => lang === 'EN' && /[一-龥]/.test(product.name) ? '' : product.name;
      const relatedProduct = product => lang === 'EN' ? ({ 'LWIR 長波紅外光學鏡頭': 'LWIR Long-Wave Infrared Lens', '非導電型奈米散熱塗料': 'Insulating Nano Thermal Coating', '高輻射奈米散熱塗料': 'High-Emissivity Nano Thermal Coating', '水溶膠': 'Water-Soluble Protective Gel', '長效型靜電消除劑': 'Long-Life Antistatic Agent', '長效型防霧膜 / 防霜膜': 'Long-Life Anti-Fog / Anti-Frost Film', '奈米壓印光學塗料': 'Nanoimprint Optical Coating', '高純度碳纖維粉': 'High-Purity Carbon Fiber Powder', 'SiC 高純度微粉': 'High-Purity SiC Powder', 'AlN高純度粉體': 'High-Purity AlN Powder' }[product] || product) : product;

      const reportText = report => {
        const translated = REPORT_EN[report.id];
        return lang === 'EN' && Array.isArray(translated) ? translated[0] : lang === 'EN' && translated ? translated : report.title;
      };
      const reportSummary = report => {
        const translated = REPORT_EN[report.id];
        return lang === 'EN' && Array.isArray(translated) ? translated[1] : report.summary;
      };
      const reportType = type => lang === 'EN' ? ({ '影像展示': 'Imaging Demonstration', '技術解析': 'Technical Analysis', '應用指南': 'Application Guide', '效能評估': 'Performance Evaluation', '驗證報告': 'Validation Report', '材料筆記': 'Materials Note', '製程知識': 'Process Knowledge', '材料解析': 'Materials Analysis', '研發流程': 'R&D Process' }[type] || type) : type;

      const [selectedProductSpec, setSelectedProductSpec] = useState(null);

        name: '',
        company: '',
        email: '',
        phone: '',
        category: '共同研發與良率優化(Co-Development & Yield Optimization)',
        description: ''

      const [contactModalOpen, setContactModalOpen] = useState(false);

      const GOOGLE_FORM_FIELDS = {
        name: 'entry.485956314',
        company: 'entry.948369039',
        email: 'entry.594370760',
        phone: 'entry.1908957481',
        category: 'entry.1016993692',
        description: 'entry.572783834'
      };

      const initialContactForm = {
        name: '',
        company: '',
        email: '',
        phone: '',
        category: '共同研發與良率優化(Co-Development & Yield Optimization)',
        description: ''
      };

      const handleContactInputChange = (field, value) => {
        setContactForm(prev => ({ ...prev, [field]: value }));
      };

      const submitToGoogleForm = async () => {
        const submitHiddenForm = () => {
          try {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = GOOGLE_FORM_ACTION;
            form.target = 'crystal-yu-contact-iframe';
            form.acceptCharset = 'utf-8';
            form.style.display = 'none';

            const hiddenFields = [
              [GOOGLE_FORM_FIELDS.name, contactForm.name],
              [GOOGLE_FORM_FIELDS.company, contactForm.company],
              [GOOGLE_FORM_FIELDS.email, contactForm.email],
              [GOOGLE_FORM_FIELDS.phone, contactForm.phone],
              [GOOGLE_FORM_FIELDS.category, contactForm.category],
              [GOOGLE_FORM_FIELDS.description, contactForm.description],
              ['fvv', '1'],
              ['pageHistory', '0']
            ];

            hiddenFields.forEach(([name, value]) => {
              const input = document.createElement('input');
              input.type = 'hidden';
              input.name = name;
              input.value = String(value);
              form.appendChild(input);
            });

            document.body.appendChild(form);
            form.submit();
            form.remove();
            return true;
          } catch (error) {
            return false;
          }
        };

        const formSubmitted = submitHiddenForm();
        return formSubmitted;
      };

      const handleContactSubmit = async (e) => {
        e.preventDefault();
        if (!e.currentTarget.checkValidity()) {
          e.currentTarget.reportValidity();
          return;
        }

        if (isContactSubmitting) return;
        setIsContactSubmitting(true);

        const submitted = await submitToGoogleForm();

        let submissionFinished = false;
        const finishSubmission = () => {
          if (submissionFinished) return;
          submissionFinished = true;
          setContactForm(initialContactForm);
          setIsContactSubmitting(false);
          setContactModalMessage(
            submitted
              ? '需求已送出，我們將盡快與您聯絡！'
              : '表單送出時遇到連線問題，請直接使用郵件聯絡我們，或稍後再試。'
          );
          setContactModalOpen(true);
        };

        if (iframeRef.current) {
          iframeRef.current.onload = finishSubmission;
        }
        setTimeout(finishSubmission, 1200);
      };

      const handleMenuMouseEnter = () => {
        if (megaMenuTimeout.current) clearTimeout(megaMenuTimeout.current);
        setMegaMenuOpen(true);
      };

      const handleMenuMouseLeave = () => {
        megaMenuTimeout.current = setTimeout(() => {
          setMegaMenuOpen(false);
        }, 250);
      };

      const currentCategoryObj = useMemo(() => {
        return CATEGORIES.find(c => c.id === currentTab) || CATEGORIES[0];
      }, [currentTab]);

      const filteredProducts = useMemo(() => {
        return currentCategoryObj.products.filter(p => {
          const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              p.nameZH.includes(searchQuery) ||
                              p.desc.includes(searchQuery);
          return matchSearch;
        });
      }, [currentCategoryObj, searchQuery]);

      const activeTechReportGroup = TECH_REPORT_GROUPS.find(group => group.id === techReportGroupId) || TECH_REPORT_GROUPS[0];
      const activeTechSubcategory = activeTechReportGroup.subcategories.find(subcategory => subcategory.id === techReportSubcategoryId) || activeTechReportGroup.subcategories[0];

      const openProductSpec = (product) => {
        setSelectedProductSpec(product);
        setActiveNav('product-spec');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const showToast = (text) => {
        setToastMsg(text);
        setTimeout(() => setToastMsg(null), 3800);
      };

      const handleDownloadProductSpec = (productName, dsObj) => {
        if (!dsObj) return;
        showToast(`已開始下載「${productName}」${dsObj.name}：${dsObj.file}`);

        const link = document.createElement('a');
        link.href = dsObj.file;
        link.download = dsObj.file.split('/').pop();
        link.target = '_blank';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="min-h-screen flex flex-col font-sans bg-itri-extralight text-itri-dark selection:bg-itri-blue selection:text-white relative">
          
          <OpticsBackground />

          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-itri-dark text-white px-5 py-3.5 rounded-xl shadow-2xl flex items-center gap-3 border border-itri-teal animate-bounce">
              <div className="w-8 h-8 rounded-full bg-itri-teal/20 text-itri-teal flex items-center justify-center font-bold">
                <IconDownload className="w-4 h-4 text-itri-teal" />
              </div>
              <span className="text-xs sm:text-sm font-medium text-slate-100">{toastMsg}</span>
            </div>

            className="hidden"

              <div className="text-center mb-12">
                <h2 className="text-3xl font-extrabold text-itri-dark mb-3">{copy.contactTitle}</h2>
                <p className="text-itri-gray text-sm">{lang === 'EN' ? 'Complete the form below and our technical team will contact you within 24 hours.' : '請填寫以下資訊，我們的技術團隊將於 24 小時內與您聯繫'}</p>
              </div>

              <form onSubmit={handleContactSubmit} className="bg-itri-extralight rounded-2xl p-6 sm:p-10 border border-itri-lightgray shadow-sm space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                  <div>
                    <label className="block text-xs font-semibold text-itri-dark mb-2">{copy.name}</label>
                    <input 
                      type="text"
                      required
                      value={contactForm.name}
                      onChange={e => handleContactInputChange('name', e.target.value)}
                      placeholder={lang === 'EN' ? 'Your name' : '您的姓名'}
                      className="w-full bg-white border border-itri-lightgray rounded-xl px-4 py-3 text-sm text-itri-dark placeholder-itri-midgray focus:outline-none focus:border-itri-blue"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-itri-dark mb-2">{copy.company}</label>
                    <input 
                      type="text"
                      required
                      value={contactForm.company}
                      onChange={e => handleContactInputChange('company', e.target.value)}
                      placeholder={lang === 'EN' ? 'Company or organization name' : '公司或機構名稱'}
                      className="w-full bg-white border border-itri-lightgray rounded-xl px-4 py-3 text-sm text-itri-dark placeholder-itri-midgray focus:outline-none focus:border-itri-blue"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-itri-dark mb-2">{copy.email}</label>
                    <input 
                      type="email"
                      required
                      value={contactForm.email}
                      onChange={e => handleContactInputChange('email', e.target.value)}
                      placeholder="name@company.com"
                      className="w-full bg-white border border-itri-lightgray rounded-xl px-4 py-3 text-sm text-itri-dark placeholder-itri-midgray focus:outline-none focus:border-itri-blue"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-itri-dark mb-2">{copy.phone}</label>
                    <input 
                      type="tel"
                      value={contactForm.phone}
                      onChange={e => handleContactInputChange('phone', e.target.value)}
                      placeholder="+886 912 345 678"
                      className="w-full bg-white border border-itri-lightgray rounded-xl px-4 py-3 text-sm text-itri-dark placeholder-itri-midgray focus:outline-none focus:border-itri-blue"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-itri-dark mb-2">{copy.category}</label>
                  <select
                    value={contactForm.category}
                    onChange={e => handleContactInputChange('category', e.target.value)}
                    className="w-full bg-white border border-itri-lightgray rounded-xl px-4 py-3 text-sm text-itri-dark focus:outline-none focus:border-itri-blue"
                  >
                    <option value="無人機熱成像與監控光學鏡頭專案">{lang === 'EN' ? 'UAV Thermal Imaging & Surveillance Optics' : '無人機熱成像與監控光學鏡頭專案 (UAV & Surveillance Optics)'}</option>
                    <option value="共同研發與良率優化(Co-Development & Yield Optimization)">{lang === 'EN' ? 'Co-Development & Yield Optimization' : '共同研發與良率優化 (Co-Development & Yield Optimization)'}</option>
                    <option value="跨領域光學設計與開發試作">{lang === 'EN' ? 'Cross-Disciplinary Optical Design & Prototyping' : '跨領域光學設計與開發試作 (車用/LED/雷射)'}</option>
                    <option value="功能性塗料 / 防霧膜試塗與評估">{lang === 'EN' ? 'Functional Coating / Anti-Fog Film Evaluation' : '功能性塗料 / 防霧膜試塗與評估'}</option>
                    <option value="其他專案合作">{lang === 'EN' ? 'Other Project Collaboration' : '其他專案合作'}</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-itri-dark mb-2">{copy.description}</label>
                  <textarea 
                    rows="4"
                    required
                    value={contactForm.description}
                    onChange={e => handleContactInputChange('description', e.target.value)}
                    placeholder={lang === 'EN' ? 'Briefly describe your requirements, UAV payload, or optical specifications...' : '請簡述您的需求、無人機載重或光學規格標的...'}
                    className="w-full bg-white border border-itri-lightgray rounded-xl px-4 py-3 text-sm text-itri-dark placeholder-itri-midgray focus:outline-none focus:border-itri-blue"
                  />
                </div>

                <div className="text-center pt-2">
                  <button
                    type="submit"
                    disabled={isContactSubmitting}
                    className="w-full sm:w-auto px-10 py-3.5 rounded-xl bg-gradient-to-r from-itri-blue to-itri-teal text-white font-bold text-sm shadow-lg hover:shadow-xl hover:brightness-105 active:scale-95 transition disabled:opacity-50"
                  >
                    {isContactSubmitting ? copy.sending : copy.send}
                  </button>
                </div>
              </form>
            </div>
          </section>

          {/* FLOATING QUICK CONTACT BUTTON FOR MOBILE */}
          <div className="sm:hidden fixed bottom-4 right-4 z-30">
            <button 
              onClick={() => {
                const el = document.getElementById('contact-section');
                if (el) el.scrollIntoView({ behavior: 'smooth' });
              }}
              className="bg-itri-blue text-white p-3.5 rounded-full shadow-2xl flex items-center justify-center border border-white/20 active:scale-90 transition"
              aria-label="快速諮詢"
            >
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-4l-4 4z"></path>
              </svg>
            </button>
          </div>

          {/* FOOTER */}
          <footer className="bg-itri-dark text-white text-xs py-10 sm:py-12">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
                <div>
                  <div className="text-white font-bold text-base mb-2">晶禹科技 Crystal Yu Tech</div>
                  <p className="text-itri-midgray text-xs leading-relaxed">{copy.footerDesc}</p>
                </div>
                <div>
                  <div className="text-white font-semibold mb-2">{copy.footerProducts}</div>
                  <ul className="space-y-1.5 text-itri-midgray">
                    {CATEGORIES.map(c => (
                      <li key={c.id} className="hover:text-cyan-300 cursor-pointer active:text-cyan-400" onClick={() => { setCurrentTab(c.id); setActiveNav('products'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}>{categoryTitle(c)}</li>
                    ))}
                  </ul>
                </div>
                <div>
                  <div className="text-white font-semibold mb-2">{copy.footerContact}</div>
                  <p className="text-itri-midgray leading-relaxed">
                    {copy.service}<a href="tel:+886426222720" className="underline hover:text-cyan-300">+886 4 26222720</a><br />
                    {copy.emailLabel}<a href="mailto:kendyjojo@gmail.com" className="underline hover:text-cyan-300">kendyjojo@gmail.com</a><br />
                    {copy.address}43616 台中市清水區星海路18巷17號<br />
                    {copy.tax}94020346
                  </p>
                </div>
              </div>
              <div className="pt-8 border-t border-gray-700 text-center text-itri-midgray text-[11px]">
                © {new Date().getFullYear()} Crystal Yu Tech Co., Ltd. {copy.rights}{lang === 'ZH' ? ' 晶禹科技有限公司' : ''}
              </div>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
